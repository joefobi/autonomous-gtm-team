[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hospital-gtm"
version = "0.1.0"
description = "Shared coordination and memory tooling for the hospital GTM agent team."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
memory-client = "hospital_gtm.cli:main"
gtm-demo = "hospital_gtm.workflow:main"
agent-eval = "hospital_gtm.evals:main"

[project.optional-dependencies]
dev = [
    "black>=24.10,<26",
    "isort>=5.13,<7",
    "mypy>=1.11,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py311", "py312"]

[tool.isort]
profile = "black"
line_length = 88
src_paths = ["src", "tests"]
known_first_party = ["hospital_gtm"]

[tool.mypy]
files = ["src"]
python_version = "3.11"
strict = true
warn_unreachable = true
