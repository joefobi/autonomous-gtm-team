name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  black:
    name: black
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run black
        run: black --check src tests

  isort:
    name: isort
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run isort
        run: isort --check-only src tests

  mypy:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run mypy
        run: mypy src

      - name: Run tests
        run: python -m unittest discover -s tests
